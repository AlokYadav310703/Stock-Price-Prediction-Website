name: Daily Prediction Pipeline

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily prediction
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          MODEL_DIR: ${{ vars.MODEL_DIR || '../models' }}
          MODEL_VERSION: ${{ vars.MODEL_VERSION || 'v2.3.1' }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS || 'http://localhost:5173' }}
        run: python -m app.jobs.daily_prediction

      - name: Update actual prices for past predictions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODEL_DIR: ${{ vars.MODEL_DIR || '../models' }}
        run: python -m app.jobs.update_actual_prices

      - name: Run monitoring checks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODEL_DIR: ${{ vars.MODEL_DIR || '../models' }}
        run: python -m app.jobs.monitoring