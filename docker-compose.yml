version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aapl
      POSTGRES_PASSWORD: aapl
      POSTGRES_DB: aapl_predictor
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aapl"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://aapl:aapl@db:5432/aapl_predictor
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173
      MODEL_DIR: /models
    volumes:
      - ./models:/models:ro
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
      VITE_USE_MOCK_DATA: "false"
    ports:
      - "5173:80"

volumes:
  db_data:
